name: ci-base

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja pkg-config

      # pico9918-core generates its overlay image arrays at configure time.
      - name: Python for the overlay assets
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pillow
        run: python -m pip install --upgrade pillow

      # Python3_EXECUTABLE is pinned because CMake searches the registry before PATH
      # on Windows and can pick an interpreter pillow was not installed into.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package artifact
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/artifacts"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marduk-${{ runner.os }}
          path: artifacts
